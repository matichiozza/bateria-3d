services:
  - type: web
    name: bateria-3d
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bateria-db
          property: connectionString

databases:
  - name: bateria-db
    plan: free
    databaseName: bateria
    user: bateria
